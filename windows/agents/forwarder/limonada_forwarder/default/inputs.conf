# Which Windows logs each forwarder reads, and which Splunk index each one goes to.
# The same app goes on DC01, WS01 and WS02.

# Logons, account and group changes, new processes, scheduled tasks, log cleared (1102)
[WinEventLog://Security]
disabled = 0
index = wineventlog
start_from = oldest
current_only = 0

# Services starting and stopping, drivers, system errors
[WinEventLog://System]
disabled = 0
index = wineventlog

# Programs reporting their own errors
[WinEventLog://Application]
disabled = 0
index = wineventlog

# The text of every PowerShell script that runs (4104), from the GPO's script block logging
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = wineventlog

# Sysmon, sent as XML because that's the format the Sysmon add-on reads
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
renderXml = true
