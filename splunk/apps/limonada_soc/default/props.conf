# How Splunk reads the WAF's audit log from WEB01

[modsecurity:audit:json]
# Each event is one JSON object: turn every key into a searchable field
KV_MODE = json
TRUNCATE = 0
# Pull the method and the page out of the request line, so I can group attacks by page (D10)
EXTRACT-request = "request_line"\s*:\s*"(?<http_method>[A-Z]+)\s+(?<uri_path>[^\s?"]+)
# Short names for the fields I search on most, matching the names the Windows logs use
FIELDALIAS-short = transaction.remote_address AS src_ip response.status AS status transaction.transaction_id AS transaction_id
