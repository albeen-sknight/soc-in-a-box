# Where Splunk listens for logs coming in

# The Universal Forwarders on DC01, WS01 and WS02 connect here.
# TLS gets switched on in Phase 3, before any real logs cross the home network.
[splunktcp://9997]
disabled = 0

# The HEC token itself is created from SPLUNK_HEC_TOKEN in .env, not stored here.
# WEB01 names the index (waf or linux) inside every event it sends.
