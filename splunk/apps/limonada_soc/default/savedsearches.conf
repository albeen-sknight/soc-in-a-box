[D02 Password spray from one source]
description = One source fails logons against many different accounts in a short window. ATT&CK T1110.003.
search = index=wineventlog (EventCode=4625 OR EventCode=4771) \
| eval src=coalesce(IpAddress, src_ip, Source_Network_Address) \
| eval acct=coalesce(TargetUserName, user, src_user) \
| search NOT acct="*$" NOT acct="ANONYMOUS LOGON" \
| where EventCode=4625 OR (EventCode=4771 AND Status="0x18") \
| bucket span=10m _time \
| stats dc(acct) as accounts values(acct) as accounts_list by _time, src \
| where accounts > 10 \
| eval time=strftime(_time, "%F %T")
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = src
alert.suppress.period = 1h
action.webhook = 1
action.webhook.param.url = http://pager-relay:8000/alert?priority=4

[D05 Encoded or hidden PowerShell]
description = PowerShell started with an encoded command or a hidden window to obscure what it runs. ATT&CK T1059.001.
search = (index=wineventlog EventCode=4104 (ScriptBlockText="*frombase64string*" OR ScriptBlockText="*gnirtS46esaBmorF*")) OR (index=wineventlog EventCode=4688 (CommandLine="*-enc *" OR CommandLine="*-encodedcommand*" OR CommandLine="*-e *" OR CommandLine="* -w hidden*" OR CommandLine="*-windowstyle hidden*" OR CommandLine="*frombase64string*")) \
| eval user=coalesce(user, src_user, Account_Name) \
| eval cmd=coalesce(CommandLine, ScriptBlockText) \
| eval evidence=if(EventCode=4104, "script block 4104", "command line 4688") \
| search NOT user="*$" \
| stats count min(_time) as first values(evidence) as evidence by host, user, cmd \
| eval time=strftime(first, "%F %T")
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host, cmd
alert.suppress.period = 1h
action.webhook = 1
action.webhook.param.url = http://pager-relay:8000/alert?priority=4

[D06 Process opening LSASS memory]
description = A process opens LSASS memory with access rights used for credential dumping. ATT&CK T1003.001.
search = index=sysmon EventCode=10 TargetImage="*\\lsass.exe" \
| search GrantedAccess IN ("0x1010", "0x1410", "0x1438", "0x143a", "0x1fffff", "0x1010", "0x1438") \
| search NOT SourceUser IN ("NT AUTHORITY\\SYSTEM", "NT AUTHORITY\\NETWORK SERVICE", "NT AUTHORITY\\LOCAL SERVICE") \
| stats count min(_time) as first by Computer, SourceImage, SourceUser, GrantedAccess, CallTrace \
| eval host=Computer \
| eval time=strftime(first, "%F %T")
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host, SourceImage
alert.suppress.period = 1h
action.webhook = 1
action.webhook.param.url = http://pager-relay:8000/alert?priority=5

[D09 Office starting a shell]
description = Word or Excel starts a command prompt or PowerShell, the classic sign of a bad attachment. ATT&CK T1204.002.
search = (index=sysmon EventCode=1) OR (index=wineventlog EventCode=4688) \
| eval parent=lower(coalesce(ParentImage, Parent_Process_Name, ParentProcessName)) \
| eval child=lower(coalesce(Image, New_Process_Name, NewProcessName)) \
| eval cmd=coalesce(CommandLine, Process_Command_Line) \
| eval user=coalesce(user, src_user, Account_Name) \
| where (like(parent, "%winword.exe") OR like(parent, "%excel.exe") OR like(parent, "%powerpnt.exe")) \
| where (like(child, "%cmd.exe") OR like(child, "%powershell.exe") OR like(child, "%pwsh.exe") OR like(child, "%wscript.exe") OR like(child, "%cscript.exe") OR like(child, "%mshta.exe")) \
| stats count min(_time) as first values(cmd) as cmd by host, user, parent, child \
| eval time=strftime(first, "%F %T")
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host, child
alert.suppress.period = 1h
action.webhook = 1
action.webhook.param.url = http://pager-relay:8000/alert?priority=4
