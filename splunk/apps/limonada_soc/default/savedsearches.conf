# The SOC's detections, one scheduled alert each. Every one runs every minute over the last 15 minutes.
# A real SOC would run them every 5 to 15 minutes; in a small lab every minute costs almost nothing and pages me faster.
# Severity numbers as Splunk shows them: 3 = Medium, 4 = High, 5 = Critical.
# The detection cards in detections/ explain each search in plain words.

[D10 WAF blocks then a success from the same source]
description = Many WAF blocks from one source on one page, then a success on that same page. ATT&CK T1190.
search = index=waf \
| stats count AS total, count(eval(status=403)) AS blocks, min(eval(if(status=403, _time, null()))) AS first_block, max(eval(if(status>=200 AND status<400, _time, null()))) AS last_ok BY src_ip uri_path \
| where blocks >= 5 AND last_ok > first_block \
| eval first_block=strftime(first_block, "%F %T"), last_ok=strftime(last_ok, "%F %T")
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = src_ip,uri_path
alert.suppress.period = 1h
# Page my phone through the relay in pager/ (priority 4 = High)
action.webhook = 1
action.webhook.param.url = http://pager-relay:8000/alert?priority=4

[D01 Many failed logons then a success]
description = Ten or more failed logons for one account, then a successful logon for that same account. ATT&CK T1110.
search = index=wineventlog (EventCode=4625 OR EventCode=4624) user!="*$" Logon_Type IN (2, 3, 7, 10, 11) \
| stats count(eval(EventCode=4625)) AS failures, count(eval(EventCode=4624)) AS successes, min(eval(if(EventCode=4625, _time, null()))) AS first_fail, max(eval(if(EventCode=4624, _time, null()))) AS last_success, values(host) AS host, values(src_ip) AS src_ip BY user \
| where failures >= 10 AND successes >= 1 AND last_success > first_fail \
| eval first_fail=strftime(first_fail, "%F %T"), last_success=strftime(last_success, "%F %T")
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 1h
action.webhook = 1
action.webhook.param.url = http://pager-relay:8000/alert?priority=4
