# One index per family of logs, like one filing cabinet per department.
# Each one keeps 90 days or 10 GB, whichever comes first, so the laptop never fills up.

# Windows event logs from DC01, WS01 and WS02: Security, System, PowerShell
[wineventlog]
homePath   = $SPLUNK_DB/wineventlog/db
coldPath   = $SPLUNK_DB/wineventlog/colddb
thawedPath = $SPLUNK_DB/wineventlog/thaweddb
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 10240

# Sysmon from the Windows machines: processes, network connections, LSASS access
[sysmon]
homePath   = $SPLUNK_DB/sysmon/db
coldPath   = $SPLUNK_DB/sysmon/colddb
thawedPath = $SPLUNK_DB/sysmon/thaweddb
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 10240

# Linux logs from WEB01, such as logins over SSH
[linux]
homePath   = $SPLUNK_DB/linux/db
coldPath   = $SPLUNK_DB/linux/colddb
thawedPath = $SPLUNK_DB/linux/thaweddb
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 5120

# The ModSecurity audit log from the WAF in front of the web shop
[waf]
homePath   = $SPLUNK_DB/waf/db
coldPath   = $SPLUNK_DB/waf/colddb
thawedPath = $SPLUNK_DB/waf/thaweddb
frozenTimePeriodInSecs = 7776000
maxTotalDataSizeMB = 5120
