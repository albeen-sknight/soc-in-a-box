# SOC in a Box: the SOC side. It runs in Docker on the PC, outside the lab network,
# the way a managed SOC sits outside its client's office.
# Phase 1 starts Splunk only. Wazuh and the alert relay join in later phases.
# Start it with:  docker compose up -d

name: soc-in-a-box

services:
  splunk:
    # Pinned version, so the lab behaves the same every time I rebuild it
    image: splunk/splunk:10.4.4
    container_name: splunk
    hostname: soc-splunk
    restart: unless-stopped
    environment:
      # Splunk won't start unless both of these accept the licence and terms
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      # Both come from .env, and compose stops with a message if one is empty
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD in .env}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN in .env}
      # The Windows and Sysmon add-ons, installed on first start (see splunk/addons/README.md)
      SPLUNK_APPS_URL: /tmp/addons/windows-ta.tgz,/tmp/addons/sysmon-ta.tgz
    ports:
      # Splunk Web, on this PC only for now. Phase 4 opens it to the tablet.
      - "127.0.0.1:8000:8000"
      # HTTP Event Collector (HEC): WEB01 sends the WAF and Linux logs here
      - "8088:8088"
      # The Universal Forwarders on DC01, WS01 and WS02 send here, through 10.10.10.1
      - "9997:9997"
      # Management API, reachable from this PC only (the tests use it)
      - "127.0.0.1:8089:8089"
    volumes:
      # Indexed data and settings survive a container restart or rebuild
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
      # My own app: the indexes and inputs, kept as code in this repo
      - ./splunk/apps/limonada_soc:/opt/splunk/etc/apps/limonada_soc
      # The add-on files I download from Splunkbase, read only
      - ./splunk/addons:/tmp/addons:ro

  # WEB01's courier: reads the WAF Flight Recorder's audit log and sends it to Splunk through HEC.
  # The WAF itself runs from its own repo, next to this one: C:\GitHub\waf-flight-recorder
  waf-shipper:
    image: fluent/fluent-bit:5.1.3
    container_name: waf-shipper
    restart: unless-stopped
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    environment:
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?Set SPLUNK_HEC_TOKEN in .env}
    volumes:
      - ./web01/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      # The WAF's flight recorder folder, read only
      - ${WAF_LOG_DIR:-../waf-flight-recorder/evidence/raw}:/waf-logs:ro
      # Remembers how far it has read, so a restart doesn't send everything twice
      - waf-shipper-db:/fluent-bit/db
    depends_on:
      splunk:
        condition: service_healthy

  # The pager: catches Splunk's alert webhooks and pushes a short message to my phone through ntfy.
  # No published ports: only Splunk, inside Docker's network, can reach it.
  pager-relay:
    image: python:3.13-alpine
    container_name: pager-relay
    restart: unless-stopped
    command: ["python", "-u", "/pager/relay.py"]
    environment:
      NTFY_TOPIC: ${NTFY_TOPIC:?Set NTFY_TOPIC in .env}
    volumes:
      - ./pager/relay.py:/pager/relay.py:ro

volumes:
  splunk-var:
  splunk-etc:
  waf-shipper-db:
