# WEB01's courier. It reads the WAF's audit log, one JSON line per request,
# and sends each request to Splunk's HTTP Event Collector (HEC).

[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

# Read new lines from the WAF Flight Recorder's audit log.
# Polling instead of file events, because Docker on Windows doesn't pass file events through.
[INPUT]
    Name              tail
    Tag               waf.audit
    Path              /waf-logs/audit.json
    Parser            json
    DB                /fluent-bit/db/waf-audit.db
    Read_From_Head    On
    Inotify_Watcher   false
    Refresh_Interval  5
    Mem_Buf_Limit     10MB
    Buffer_Max_Size   1MB
    Skip_Long_Lines   On

# Label every event as coming from WEB01, the company's web shop
[FILTER]
    Name    record_modifier
    Match   waf.audit
    Record  host WEB01

# Send to Splunk over HTTPS. Splunk's certificate is self signed, so don't check it.
[OUTPUT]
    Name              splunk
    Match             waf.audit
    Host              splunk
    Port              8088
    Splunk_Token      ${SPLUNK_HEC_TOKEN}
    TLS               On
    TLS.Verify        Off
    Event_Host        $host
    Event_Source      modsecurity:audit
    Event_Sourcetype  modsecurity:audit:json
    Event_Index       waf
